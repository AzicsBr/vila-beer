<!-- Faixas que correm (src/motion/faixas.js): os itens ficam aqui, uma vez só; o JS repete o bastante para emendar.
     Item com miniatura: texto + <img> redonda (200 × 200); sem foto, troque a <img> por <span class="faixa__bola"></span>.
     A faixa de volta usa os mesmos itens, na ordem inversa. --antes: a cor da seção de cima (aqui, o hero). -->
<div class="faixas" aria-label="O que tem na casa" style="--antes: var(--cor-hero)">
  <div class="faixa faixa--tinta">
    <div class="faixa__trilho" data-itens>
      <span class="faixa__item">Chopp<img src="/img/mini/chopp.webp" alt="" width="200" height="200"></span>
      <span class="faixa__item">Drinks<img src="/img/mini/caipirinha.webp" alt="" width="200" height="200"></span>
      <span class="faixa__item">Pizza<img src="/img/mini/pizza.webp" alt="" width="200" height="200"></span>
      <span class="faixa__item">Parmegiana<img src="/img/mini/parmegiana.webp" alt="" width="200" height="200"></span>
      <span class="faixa__item">Porções<img src="/img/mini/fritas.webp" alt="" width="200" height="200"></span>
      <span class="faixa__item">Música ao vivo<span class="faixa__bola"></span></span>
      <span class="faixa__item">Gin tônica<img src="/img/mini/gin.webp" alt="" width="200" height="200"></span>
      <span class="faixa__item">Petiscos<span class="faixa__bola"></span></span>
    </div>
  </div>
  <div class="faixa faixa--papel"><div class="faixa__trilho faixa__trilho--volta" data-volta></div></div>
</div>
